[project]
name = "instrument-agnostic-amt"
version = "0.1.0"
requires-python = ">=3.10,<3.15"
dependencies = [
    "dlchordx",
    "einops",
    "mido",
    "numpy",
    "pretty-midi",
    "pyyaml",
    "scipy",
    "soundfile",
    "torch==2.13.0",
    "torchaudio==2.11.0",
    "tqdm",
    "triton-windows>=3.7.1.post27,<3.8; sys_platform == 'win32'",
]

[project.optional-dependencies]
evaluation = [
    "mir-eval",
]
stem = [
    "chord-romanizer",
    "librosa",
    "stem-splitter",
]
# beat_source="sheetsage2" (ビート・拍子・セクションを SheetSage2-Refined で推定) 用。
# 重みは CC BY-NC 4.0 (非商用)。
sheetsage = [
    "sheetsage2-refined",
]
training = [
    "audiomentations",
    "pedalboard",
    "tensorboard",
    "torch-optimizer",
    "wandb",
]

[dependency-groups]
dev = [
    "pytest",
    "tomli; python_version < '3.11'",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
sheetsage2-refined = { git = "https://github.com/anime-song/SheetSage2-Refined" }
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
